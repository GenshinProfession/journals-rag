# 仅数据库 + 后端 + Worker。配合本地 `npm run dev`（Vite 已代理 /api -> localhost:8000）。
# 用法: docker compose -f deploy/docker-compose.backend-only.yml up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: journals_rag
      POSTGRES_USER: journals
      POSTGRES_PASSWORD: journer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file:
      - ../.env.example
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    env_file:
      - ../.env.example
    volumes:
      - uploads:/data/uploads
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  uploads:
