[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "journals-rag-backend"
version = "0.1.0"
description = "FastAPI backend for thesis generation, billing, model routing, and RAG."
requires-python = ">=3.11"
dependencies = [
  "alembic",
  "bcrypt",
  "celery",
  "fastapi",
  "httpx",
  "passlib[bcrypt]",
  "pgvector",
  "psycopg[binary]",
  "python-docx",
  "pypdf",
  "pydantic-settings",
  "python-jose[cryptography]",
  "python-multipart",
  "redis",
  "sqlalchemy",
  "uvicorn[standard]"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
